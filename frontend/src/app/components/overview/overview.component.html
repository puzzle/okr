  <app-overview-banner app-banner id="banner-component"></app-overview-banner>
  <p no-data-message>Kein Team ausgewählt</p>

  @for (overviewEntity of data(); track $index) {
  <app-team [overviewEntity]="overviewEntity"></app-team>
  }
</app-application-page>
